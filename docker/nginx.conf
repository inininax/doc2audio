server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # Explicit browser-runtime MIME types, including modules and compressed OCR data.
    types {
        text/html html;
        text/css css;
        text/plain txt;
        text/markdown md;
        application/javascript js mjs;
        application/json json map;
        application/manifest+json webmanifest;
        application/wasm wasm;
        application/gzip gz;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/svg+xml svg;
        image/webp webp;
        image/x-icon ico;
        audio/mpeg mp3;
        audio/wav wav;
        font/ttf ttf;
        font/otf otf;
        font/woff woff;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    gzip off;
    gzip_static off;
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # Routes use URL hashes. Missing assets must never fall back to index.html.
        try_files $uri $uri/ =404;
    }
}
