services:
  web:
    image: doc2audio-web
    build:
      context: .
      args:
        DOC2AUDIO_BASE: ${DOC2AUDIO_BASE:-/}
        DOC2AUDIO_SITE_URL: ${DOC2AUDIO_SITE_URL:-}
    ports:
      - "127.0.0.1:${DOC2AUDIO_PORT:-8080}:8080"
    restart: unless-stopped
    # The image checks its local /healthz endpoint every 30 seconds.
