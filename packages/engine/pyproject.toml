[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "doc2audio-core"
version = "0.2.0"
description = "Local document extraction and speech engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-audio==0.5.3", "supertonic==1.3.1", "soundfile>=0.14,<0.15",
  "pymupdf>=1.28.2,<1.29", "python-docx>=1.2,<1.3",
  "pyobjc-framework-Vision>=12.2,<13; sys_platform == 'darwin'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doc2audio"]
