<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">웹에서 열고, 내 PC에서 처리하는 doc2audio</title>
  <desc id="desc">최초 준비 때 웹서버에서 화면과 실행 파일을, 모델 제공처에서 모델 파일을 내려받습니다. 문서 선택, 글자 추출, CPU 음성 생성, MP3 저장은 모두 사용자 PC의 브라우저 안에서 처리합니다. 모델과 작업은 브라우저 전용 저장소 IndexedDB에 남고, 브라우저를 닫으면 계산을 중단했다가 다시 열어 이어갑니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#426b4f"/>
    </marker>
    <style>
      text { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #172b20; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 23px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #476050; }
      .arrow { fill: none; stroke: #426b4f; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="750" rx="24" fill="#f6f8f5"/>
  <text x="48" y="58" class="title">웹에서 열고, 내 PC에서 처리합니다</text>
  <text x="48" y="91" class="body">기본 브라우저 모드 · Supertonic 3</text>

  <rect x="78" y="123" width="440" height="104" rx="16" fill="#ffffff" stroke="#c7d4c7"/>
  <text x="106" y="162" class="label">웹 서버</text>
  <text x="106" y="195" class="body">화면과 실행 프로그램 제공</text>
  <rect x="682" y="123" width="440" height="104" rx="16" fill="#ffffff" stroke="#c7d4c7"/>
  <text x="710" y="162" class="label">모델 제공처</text>
  <text x="710" y="195" class="body">공개 모델 파일 제공 · 약 401 MB</text>
  <path d="M298 227 V282" class="arrow"/>
  <path d="M902 227 V282" class="arrow"/>
  <rect x="452" y="237" width="296" height="39" rx="19" fill="#e7eee4"/>
  <text x="600" y="263" text-anchor="middle" class="small">최초 다운로드 후 내 PC에 보관</text>

  <rect x="48" y="289" width="1104" height="402" rx="20" fill="#ffffff" stroke="#779b74" stroke-width="2"/>
  <text x="78" y="331" class="section">내 PC · 브라우저</text>
  <text x="78" y="362" class="body">선택한 문서와 생성 음성을 외부 서버에 업로드하지 않습니다.</text>

  <rect x="78" y="394" width="226" height="117" rx="14" fill="#edf3e9"/>
  <text x="96" y="428" class="label">1. 문서 선택</text>
  <text x="96" y="458" class="body">내 PC의 파일 읽기</text>
  <text x="96" y="488" class="small">PDF · Word · TXT</text>
  <path d="M310 451 H343" class="arrow"/>
  <rect x="350" y="394" width="226" height="117" rx="14" fill="#edf3e9"/>
  <text x="368" y="428" class="label">2. 글자 추출</text>
  <text x="368" y="458" class="body">본문을 짧게 분할</text>
  <text x="368" y="488" class="small">필요하면 OCR</text>
  <path d="M582 451 H615" class="arrow"/>
  <rect x="622" y="394" width="226" height="117" rx="14" fill="#edf3e9"/>
  <text x="640" y="428" class="label">3. 음성 생성</text>
  <text x="640" y="458" class="body">모델 → RAM</text>
  <text x="640" y="488" class="small">내 CPU에서 WASM 실행</text>
  <path d="M854 451 H887" class="arrow"/>
  <rect x="894" y="394" width="226" height="117" rx="14" fill="#edf3e9"/>
  <text x="912" y="428" class="label">4. MP3 저장</text>
  <text x="912" y="458" class="body">음성을 합쳐 파일 생성</text>
  <text x="912" y="488" class="small">저장 버튼으로 다운로드</text>

  <rect x="78" y="539" width="1042" height="111" rx="14" fill="#f5f6f3" stroke="#d7e0d4"/>
  <text x="100" y="572" class="label">내 디스크의 브라우저 전용 저장소 · IndexedDB</text>
  <text x="100" y="602" class="body">모델 · 선택한 원문 · 설정 · 완료된 음성 구간 · 완성 MP3</text>
  <text x="100" y="632" class="small">창을 닫으면 계산 중단 → 같은 사이트·프로필에서 다시 열어 이어하기</text>
  <text x="48" y="725" class="small">모델과 오프라인 화면 준비가 끝나면 인터넷 없이 변환할 수 있습니다.</text>
</svg>
