[project]
name = "doc2audio-workspace"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["doc2audio", "doc2audio-core", "doc2audio-server"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/engine", "apps/cli", "apps/server"]

[tool.uv.sources]
doc2audio = { workspace = true }
doc2audio-core = { workspace = true }
doc2audio-server = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/server/tests"]
markers = ["integration: real platform tools and document extraction"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["scripts/ai-env.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["doc2audio", "doc2audio_cli", "doc2audio_server"]
